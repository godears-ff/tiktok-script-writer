name: Validate Skill

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Validate skill
        run: python scripts/validate_skill.py

      - name: Smoke test idea generator
        run: python scripts/generate-ideas.py fitness > /dev/null
